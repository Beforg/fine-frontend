<div class="modal-overlay" *ngIf="showModal">
    <!-- Modal -->

    <div class="modal-content">
        <!-- Cabeçalho do Modal -->
        <div class="modal-content__header">
            <h2>Editar Agendamento</h2>
            <button (click)="handleFecharModal()">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <!-- Corpo/Conteúdo do Modal -->
        <div class="modal-content__body">
            <form class="modal-content__form">
                <!-- Informações do Cliente -->
                <div class="modal-content__group">
                    <label class="group-label">Cliente</label>
                    <p class="group-value">{{agendamento?.nomeCliente}}</p>
                </div>

                <!-- Trocar Barbeiro -->
                <div class="modal-content__group">
                    <label class="group-label">Barbeiro</label>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Selecione o barbeiro</mat-label>
                        <mat-select [(ngModel)]="barbeiroSelecionadoId" name="barbeiro">
                            <mat-option *ngFor="let barbeiro of barbeiros" [value]="barbeiro.barbeiroId">
                                {{ barbeiro.nome }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Adicionar Produtos -->
                <div class="modal-content__group">
                    <label class="group-label">Adicionar Produtos</label>
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Escolha um produto</mat-label>
                        <mat-select (selectionChange)="adicionarProduto($event.value)">
                            <mat-option *ngFor="let produto of produtosDisponiveis" [value]="produto">
                                <div class="option-content">
                                    <span class="option-name">{{ produto.nome }}</span>
                                    <span class="option-price">R$ {{ produto.preco.toFixed(2) }}</span>
                                </div>
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Produtos Selecionados -->
                <div class="modal-content__group" *ngIf="produtosSelecionados.length > 0">
                    <label class="group-label">Produtos Selecionados</label>
                    <div class="produtos-lista">
                        <div class="produto-item" *ngFor="let produto of produtosSelecionados; let i = index">
                            <span class="produto-nome">{{ produto.nome }}</span>
                            <div class="produto-actions">
                                <button type="button" class="quantity-btn" (click)="diminuirQuantidade(i)" mat-icon-button>
                                    <mat-icon>remove</mat-icon>
                                </button>
                                <span class="quantidade">{{ produto.quantidade }}</span>
                                <button type="button" class="quantity-btn" (click)="aumentarQuantidade(i)" mat-icon-button>
                                    <mat-icon>add</mat-icon>
                                </button>
                                <span class="produto-preco">R$ {{ (produto.preco * produto.quantidade).toFixed(2) }}</span>
                                <button type="button" class="remove-btn" (click)="removerProduto(i)" mat-icon-button color="warn">
                                    <mat-icon>close</mat-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Rodapé do Modal -->
        <div class="modal-content__footer">
            <button type="button" class="btn-cancelar" (click)="handleFecharModal()">
                Cancelar
            </button>
            <button type="button" class="btn-salvar" (click)="handleSalvar()">
                <mat-icon>save</mat-icon>
                Salvar Alterações
            </button>
        </div>
    </div>
</div>
