<div class="gerenciamento-conteiner" *ngIf="showGerenciamento">
    <div class="filtros-header">
        <div class="filtros-container">
            <a (click)="toggleTab(false, false, true, false)" *ngIf="isAdmin()"
                [ngClass]="{'active-gerenciamento': showProdutos}">
                <mat-icon>shopping_bag</mat-icon>
                <span>Produtos</span>
            </a>
            <a (click)="toggleTab(false, true, false, false)" *ngIf="isAdmin()"
                [ngClass]="{'active-gerenciamento': showServicos}">
                <mat-icon>content_cut</mat-icon>
                <span>Serviços</span>
            </a>
            <a (click)="toggleTab(true, false, false, false)" *ngIf="isAdmin()"
                [ngClass]="{'active-gerenciamento': showBarbeiros}">
                <mat-icon>person</mat-icon>
                <span>Barbeiros</span>
            </a>
            <a (click)="toggleTab(false, false, false, true)" *ngIf="isAdmin()"
                [ngClass]="{'active-gerenciamento': showDisponibilidade}">
                <mat-icon>event_available</mat-icon>
                <span>Disponibilidade</span>
            </a>
            <a (click)="toggleTab(false, false, false, false, true)" *ngIf="isAdmin()"
                [ngClass]="{'active-gerenciamento': showClientes}">
                <mat-icon>people</mat-icon>
                <span>Clientes</span>
            </a>
            <!-- <a *ngIf="isAdmin()">Disponibilidade</a> -->
        </div>
    </div>
    <div class="gerenciamento-body">
        <div class="gerenciamento-produtos" *ngIf="showProdutos && isAdmin()">
            <app-produtos-gerenciamento></app-produtos-gerenciamento>
        </div>
        <div class="gerenciamento-servicos" *ngIf="showServicos && isAdmin()">
            <app-servicos-gerenciamento></app-servicos-gerenciamento>
        </div>
        <div class="gerenciamento-barbeiros" *ngIf="showBarbeiros">
            <app-barbeiros-gerenciamento [barbeiros]="barbeiros"
                (barbeirosChange)="carregarBarbeiros()"></app-barbeiros-gerenciamento>
        </div>
        <div class="gerenciamento-disponibilidade" *ngIf="showDisponibilidade && isAdmin()">
            <app-disponibilidade [barbeiros]="barbeiros"></app-disponibilidade>
        </div>
        <div class="class-gerenciamento-clientes" *ngIf="showClientes && isAdmin()">
            <app-clientes></app-clientes>
        </div>
    </div>
