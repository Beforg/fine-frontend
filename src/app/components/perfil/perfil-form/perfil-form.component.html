    <mat-card class="perfil-card" *ngIf="userInfo !== null; else loadingCard">
      <!-- Avatar placeholder -->
      <div class="avatar-section">
        <div class="avatar-placeholder">
          <mat-icon>account_circle</mat-icon>
        </div>
        <button class="edit-avatar-btn" mat-mini-fab color="primary">
          <mat-icon>edit</mat-icon>
        </button>
      </div>

      <!-- Informações do usuário -->
      <div class="user-info">
        <h2 class="user-name">{{ userInfo.nome }}</h2>
        <p class="user-role">{{ userRole }}</p>
      </div>

      <!-- Formulário de dados -->
      <div class="form-section">
        <h3 class="section-title">Informações Pessoais</h3>
        
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nome Completo</mat-label>
            <input matInput [value]="userInfo.nome" readonly>
            <mat-icon matSuffix>person</mat-icon>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>E-mail</mat-label>
            <input matInput [value]="userEmail" readonly>
            <mat-icon matSuffix>email</mat-icon>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Telefone</mat-label>
            <input matInput [value]="userInfo.telefone" readonly>
            <mat-icon matSuffix>phone</mat-icon>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Data de Cadastro</mat-label>
            <input matInput [value]="userInfo.dataCadastro" readonly>
            <mat-icon matSuffix>event</mat-icon>
          </mat-form-field>
        </div>
      </div>

      <!-- Ações -->
      <div class="actions-section">
        <button mat-raised-button color="primary" class="edit-button">
          <mat-icon>edit</mat-icon>
          Editar Perfil
        </button>
        
        <button mat-stroked-button color="warn" class="delete-button">
          <mat-icon>delete</mat-icon>
          Desativar Conta
        </button>
      </div>
    </mat-card>


    <ng-template #loadingCard>
      <mat-card class="perfil-card loading-card">
        <div class="loading-content">
          <mat-icon class="loading-icon">hourglass_empty</mat-icon>
          <p>Carregando informações do perfil...</p>
        </div>
      </mat-card>
    </ng-template>
