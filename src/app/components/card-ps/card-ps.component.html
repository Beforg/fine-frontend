<div class="card" [class.produto]="tipo === 'produto'" [class.servico]="tipo === 'servico'" (click)="onCardClick()">
  <div class="card-image">
    <img [src]="urlImagem" [alt]="nome" (error)="onImageError($event)">
    <div class="card-overlay">
      <mat-icon>{{ tipo === 'produto' ? 'shopping_bag' : 'content_cut' }}</mat-icon>
      <span class="card-type">{{ tipo | titlecase }}</span>
    </div>
  </div>

  <div class="card-content" title="{{nome}}">
    <h4 class="card-title">{{ nome }}</h4>
    <p class="card-description">{{ descricao == "" ? 'Sem Descrição' : descricao }}</p>
    
    <div class="card-details" *ngIf="tipo === 'servico'">
      <div class="detail-item">
        <mat-icon>timer</mat-icon>
        <span>{{tempoEstimado}} min</span>
      </div>
    </div>

    <div class="card-footer">
      <div class="card-price">
        <span class="price-label">Valor</span>
        <span class="price-value">R$ {{ preco | number:'1.2-2' }}</span>
      </div>
      
      <!-- Botão comentado conforme solicitado -->
      <!-- <button 
        *ngIf="tipo === 'produto'"
        class="card-action-btn" 
        mat-stroked-button 
        color="primary"
        (click)="onCardClick(); $event.stopPropagation();">
        <mat-icon>shopping_cart</mat-icon>
        Comprar
      </button> -->
      
      <button 
        *ngIf="tipo === 'servico'"
        class="card-action-btn" 
        (click)="onCardClick(); $event.stopPropagation();">
        <mat-icon>event_available</mat-icon>
        <span>Agendar</span>
      </button>
    </div>
  </div>
</div>
