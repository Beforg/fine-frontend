<!-- Botão Raised (elevado) -->
<button *ngIf="variant === 'raised'"
  mat-raised-button
  [color]="color"
  [type]="type"
  [disabled]="disabled || loading"
  [class]="'primary-button primary-button--' + size + ' primary-button--' + variant"
  (click)="onClick()">
  
  <mat-icon *ngIf="loading" class="spinner">refresh</mat-icon>
  <mat-icon *ngIf="icon && !loading">{{ icon }}</mat-icon>
  <span [class.with-icon]="icon || loading">{{ text }}</span>
</button>
