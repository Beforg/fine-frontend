  <section class="hero-section">
    <div class="hero-background" [style.background-image]="'url(' + (barbeiro?.urlBackground || '/assets/tmp/bgBarbeiro1.png') + ')'">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="page-title">Agendar Corte</h1>
        <div class="barbeiro-info">
          <div class="barbeiro-avatar">
            <img [src]="barbeiro?.urlFoto" alt="{{barbeiro?.nome}}" class="avatar-img">
          </div>
          <div class="barbeiro-details">
            <h2 class="barbeiro-name">{{barbeiro?.nome}}</h2>
            <p class="barbeiro-especialidade">{{barbeiro?.especialidade}}</p>
            <p class="barbeiro-bio" [title]="barbeiro?.bio">{{barbeiro?.bio}}</p>
            <p class="barbeiro-stats">
              <mat-icon>cut</mat-icon> {{barbeiro?.cortesRealizados}} corte(s)
            </p>
        </div>
        </div>
        
      </div>
    </div>
  </section>
  <div class="teste"></div>
